services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: ai-code-reviewer-api
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      APP_NAME: AI Code Reviewer
      DEBUG: "true"
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/tests:/app/tests:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
